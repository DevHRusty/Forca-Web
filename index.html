<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Jogo da Forca </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2> Jogo da Forca </h2>

    <div id="forca-container">
        <canvas id="Forca" width="200" height="220"></canvas>
    </div>
    
    <div id="palavras"></div>

    <div id="letras erradas"></div>

    <div id="colocar letra">
        <input type="texto" id="letras" maxlength="1" placeholder="Digite uma letra">
        <button id="botao de tentar">Sera?</button>
    </div>

    <div id="mensagem"></div>

    <script src="script.js"></script>
</body>
</html>
